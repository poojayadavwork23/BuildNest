<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BuildNest</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-container {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #e91e63;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #e91e63;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #c2185b;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h2>BuildNest Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label> Username
        <input type="text" name="username" placeholder="Enter Username" required>
        </label>
        <label>Password
        <input type="password" name="password" placeholder="Enter Password" required>
        </label>
        <button type="submit">Login</button>
        <p>
        New User?
        <a href="">Create an account</a>
    </p>
    </form>

</div>

</body>
</html>
